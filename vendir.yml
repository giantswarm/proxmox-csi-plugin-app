apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: vendor
    contents:
      - path: proxmox-csi-plugin
        git:
          depth: 1
          url: https://github.com/sergelogvinov/proxmox-csi-plugin
          ref: "v0.20.0"
        includePaths:
          - charts/proxmox-csi-plugin/**/*
        excludePaths:
          - charts/proxmox-csi-plugin/values.edge.yaml
          - charts/proxmox-csi-plugin/values.talos.yaml
          - charts/proxmox-csi-plugin/README.md.gotmpl
          - charts/proxmox-csi-plugin/icon.png
          - charts/proxmox-csi-plugin/ci/**/*
  - path: helm/proxmox-csi-plugin
    contents:
    - path: .
      directory:
        path: vendor/proxmox-csi-plugin/charts/proxmox-csi-plugin
      ignorePaths:
      - values.schema.json
      - templates/policyexception.yaml
